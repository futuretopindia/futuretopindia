    <style>
        :root {
            --bg-dark: #060913;
            --bg-card: rgba(15, 23, 42, 0.65);
            --bg-card-hover: rgba(22, 33, 58, 0.85);
            --border-glass: rgba(255, 255, 255, 0.09);
            --border-glow: rgba(242, 122, 35, 0.35);
            --accent-orange: #f27a23;
            --accent-orange-glow: rgba(242, 122, 35, 0.25);
            --accent-teal: #10b981;
            --accent-blue: #0095f6;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 10%, rgba(242, 122, 35, 0.14) 0%, transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(16, 185, 129, 0.11) 0%, transparent 42%),
                radial-gradient(circle at 50% 85%, rgba(0, 149, 246, 0.1) 0%, transparent 45%);
            background-attachment: fixed;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            color: var(--text-primary);
            line-height: 1.65;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Subtle Ambient Grid Overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: linear-gradient(rgba(255, 255, 255, 0.025) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
            background-size: 38px 38px;
            pointer-events: none;
            z-index: -1;
        }

        /* Top Scroll Progress Bar */
        .scroll-progress {
            position: fixed;
            top: 0;
            left: 0;
            height: 3px;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-orange), #fbbf24, var(--accent-teal));
            z-index: 1000;
            transition: width 0.1s ease-out;
        }

        /* Floating Navigation Pill */
        .top-nav {
            position: sticky;
            top: 14px;
            z-index: 99;
            max-width: 920px;
            margin: 14px auto 0;
            padding: 0 16px;
        }

        .nav-inner {
            background: rgba(10, 15, 28, 0.78);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid var(--border-glass);
            border-radius: 100px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 0.95rem;
            color: #fff;
            text-decoration: none;
        }

        .nav-brand .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--accent-orange);
            box-shadow: 0 0 10px var(--accent-orange);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.35); opacity: 0.65; }
        }

        .nav-links {
            display: flex;
            gap: 18px;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 500;
            transition: color 0.25s ease;
        }

        .nav-links a:hover {
            color: var(--accent-orange);
        }

        .nav-age-pill {
            background: rgba(242, 122, 35, 0.14);
            border: 1px solid rgba(242, 122, 35, 0.35);
            color: #ff9d57;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 50px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Main Container */
        .app-shell {
            max-width: 920px;
            margin: 24px auto 60px;
            padding: 0 16px;
        }

        /* HERO SECTION */
        .hero-card {
            position: relative;
            background: linear-gradient(145deg, rgba(17, 25, 46, 0.88) 0%, rgba(9, 14, 26, 0.94) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 36px 32px;
            margin-bottom: 24px;
            box-shadow: 0 28px 60px -15px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            overflow: hidden;
        }

        .hero-card::before {
            content: "";
            position: absolute;
            top: -80px;
            right: -80px;
            width: 280px;
            height: 280px;
            background: radial-gradient(circle, rgba(242, 122, 35, 0.24) 0%, transparent 70%);
            pointer-events: none;
        }

        .hero-top {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        .avatar-wrapper {
            position: relative;
            width: 102px;
            height: 102px;
            flex-shrink: 0;
        }

        .avatar-ring {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--accent-orange), #fbbf24, var(--accent-teal), var(--accent-blue), var(--accent-orange));
            animation: spinRing 8s linear infinite;
        }

        @keyframes spinRing {
            to { transform: rotate(360deg); }
        }

        .avatar-icon {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            border: 3px solid #0b1120;
            background: #131c31;
            z-index: 1;
        }

        .avatar-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .avatar-wrapper:hover .avatar-icon img {
            transform: scale(1.06);
        }

        .verified-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 26px;
            height: 26px;
            background: var(--accent-blue);
            color: #fff;
            border-radius: 50%;
            border: 2.5px solid #0b1120;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            z-index: 2;
            box-shadow: 0 4px 12px rgba(0, 149, 246, 0.5);
        }

        .hero-info {
            flex: 1;
            min-width: 240px;
        }

        .hero-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.74rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--accent-orange);
            background: rgba(242, 122, 35, 0.12);
            border: 1px solid rgba(242, 122, 35, 0.28);
            padding: 4px 12px;
            border-radius: 50px;
            margin-bottom: 10px;
        }

        .hero-info h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: clamp(1.95rem, 4vw, 2.65rem);
            font-weight: 800;
            letter-spacing: -0.6px;
            line-height: 1.15;
            background: linear-gradient(135deg, #ffffff 30%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        .hero-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            font-size: 0.88rem;
            color: var(--text-secondary);
        }

        .hero-meta span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.05);
            padding: 5px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        .hero-meta i {
            color: var(--accent-orange);
        }

        /* Dynamic Stats Bento Strip */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 26px;
            padding-top: 22px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .stat-pill {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: transform 0.25s ease, border-color 0.25s ease, background 0.25s ease;
        }

        .stat-pill:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(242, 122, 35, 0.38);
        }

        .stat-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: rgba(242, 122, 35, 0.15);
            color: var(--accent-orange);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            flex-shrink: 0;
        }

        .stat-pill:nth-child(2) .stat-icon {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-teal);
        }

        .stat-pill:nth-child(3) .stat-icon {
            background: rgba(0, 149, 246, 0.15);
            color: var(--accent-blue);
        }

        .stat-text strong {
            display: block;
            font-size: 0.9rem;
            font-weight: 700;
            color: #fff;
            line-height: 1.25;
        }

        .stat-text small {
            font-size: 0.74rem;
            color: var(--text-muted);
        }

        /* BENTO LAYOUT FOR CONTENT SECTIONS */
        .bento-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 20px;
        }

        .col-12 { grid-column: span 12; }
        .col-6 { grid-column: span 6; }

        .section-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 28px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 14px 35px -10px rgba(0, 0, 0, 0.45);
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.3s ease, background 0.3s ease;

            overflow: hidden;
        }

        .section-card:hover {

            border-color: rgba(255, 255, 255, 0.16);
            background: var(--bg-card-hover);
        }

        .section-header {

            align-items: center;
            gap: 14px;
            margin-bottom: 18px;
        }

        }
